server:
  port: 8080

spring:
  application:
    name: elm
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/elm_v2}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB


#  data:
#    redis:
#      host: 110.42.60.144
#      port: 6379
#      password: ${REDIS_PASSWORD:}
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

mybatis:
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true
  # 指定XML映射文件位置
  mapper-locations: classpath:com/tju/elm_bk/mapper/*.xml


jwt:
  # 不提供可预测的默认签名密钥；演示启动脚本会在本机 .env 中自动生成随机值。
  secret: ${JWT_SECRET}
  token-validity-in-seconds: 86400
  token-validity-in-seconds-for-remember-me: 108000

# swagger
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui

app:
  upload:
    # 用户上传图片保存在本地持久化目录；Docker 演示环境会将该目录挂载到宿主机。
    directory: ${APP_UPLOAD_DIR:./uploads}
  demo:
    # 模拟支付、模拟充值和免费会员只能在显式开启的演示环境使用。
    enabled: ${APP_DEMO_ENABLED:false}

# DeepSeek AI配置
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  chat-endpoint: /chat/completions
  model: deepseek-chat
  max-tokens: 1024
  temperature: 0.7
  top-p: 0.9
  timeout-seconds: 30
  max-retries: 3
