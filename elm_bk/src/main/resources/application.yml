server:
  port: 8080

spring:
  application:
    name: elm
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/elm_v2}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}


#  data:
#    redis:
#      host: 110.42.60.144
#      port: 6379
#      password: ${REDIS_PASSWORD:}
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

mybatis:
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true
  # 指定XML映射文件位置
  mapper-locations: classpath:com/tju/elm_bk/mapper/*.xml


jwt:
  # 不提供可预测的默认签名密钥；演示启动脚本会在本机 .env 中自动生成随机值。
  secret: ${JWT_SECRET}
  token-validity-in-seconds: 86400
  token-validity-in-seconds-for-remember-me: 108000

# swagger
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui

app:
  upload:
    # 用户上传图片保存在本地持久化目录；Docker 演示环境会将该目录挂载到宿主机。
    directory: ${APP_UPLOAD_DIR:./uploads}
  demo:
    # 模拟支付、模拟充值和免费会员只能在显式开启的演示环境使用。
    enabled: ${APP_DEMO_ENABLED:false}

# DeepSeek AI配置
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  chat-endpoint: /chat/completions
  model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
  thinking-enabled: ${DEEPSEEK_THINKING_ENABLED:false}
  max-tokens: 1024
  temperature: 0.7
  top-p: 0.9
  timeout-seconds: 10
  max-retries: 1

# 千问AI平台多模态能力：Qwen-VL 图片识菜与 Qwen-ASR 语音转写。
# 密钥只允许通过环境变量注入。
multimodal-ai:
  api-key: ${DASHSCOPE_API_KEY:}
  base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  chat-endpoint: /chat/completions
  vision-model: ${DASHSCOPE_VISION_MODEL:qwen3-vl-flash}
  speech-model: ${DASHSCOPE_SPEECH_MODEL:qwen3-asr-flash}
  timeout-seconds: 10
  max-retries: 1
  max-image-bytes: 5242880
  # OpenAI兼容接口要求Base64编码后的音频不超过10MB，原始文件限制为7MB。
  max-audio-bytes: 7340032
